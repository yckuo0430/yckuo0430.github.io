<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello 現代美學頁面</title>
    <!-- 引入 Tailwind CSS 進行現代化樣式排版 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Inter 字體 -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* 自定義柔和漸層動畫背景 */
        .bg-gradient-animate {
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
    </style>
</head>
<body class="bg-gradient-animate min-h-screen flex items-center justify-center p-4">

    <!-- 主容器：採用毛玻璃 (Glassmorphism) 設計風格 -->
    <main class="relative backdrop-blur-xl bg-white/20 border border-white/30 shadow-2xl rounded-3xl p-12 md:p-20 text-center max-w-lg w-full transition-transform duration-500 hover:scale-105">
        
        <!--裝飾性質感光暈 -->
        <div class="absolute -top-12 -left-12 w-32 h-32 bg-purple-400 rounded-full mix-blend-multiply filter blur-xl opacity-70 animate-pulse"></div>
        <div class="absolute -bottom-12 -right-12 w-32 h-32 bg-yellow-300 rounded-full mix-blend-multiply filter blur-xl opacity-70 animate-pulse"></div>

        <!-- 內容區域 -->
        <div class="relative z-10">
            <span class="inline-block px-4 py-1.5 mb-6 text-xs font-semibold tracking-widest text-white uppercase bg-white/30 backdrop-blur-md rounded-full border border-white/40 shadow-sm">
                Welcome
            </span>
            
            <h1 class="text-7xl md:text-9xl font-black text-white tracking-tight drop-shadow-md mb-4">
                Hello
            </h1>
            
            <p class="text-white/90 text-sm md:text-base font-light tracking-wide max-w-xs mx-auto">
                這是一個簡潔、優雅且具備現代感設計的 HTML 基礎頁面。
            </p>
        </div>

    </main>

</body>
</html>
